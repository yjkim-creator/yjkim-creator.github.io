#nitroBtn{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));width:92px;height:92px;margin-left:-46px;border-radius:50%;border:0;padding:6px;

#nitroBtn span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2a1450,#0b0420 70%);

#nitroBtn svg{width:30px;height:30px;fill:var(--cyan);display:block;margin:0 auto 2px}

  <script type="module">
// 원스토어 앱 안에서 실행될 때 SDK와 연결합니다. 일반 브라우저에서는 아무 일도 하지 않습니다.
import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";

// 검사 화면이 듣기 시작한 뒤에 인사(hello)를 보내도록 페이지 로드 후 잠깐 기다립니다.
function startOnestore() {
  const sdk = createSDK();
  // 뒤로가기: 원스토어 앱은 게임이 '처리함(true)'이라고 답하지 않으면 게임을 끝낸다.
  // 광고가 떠 있거나 막 닫힌 때는 처리한 것으로 답해 광고만 닫히게 하고, 그 밖에는 게임의 appBack(열린 창 닫기)에 맡긴다.
  sdk.on("pause", (e) => { if (e && e.reason === "ad") adOpen = true; });
  sdk.on("resume", () => { if (adOpen) adQuietUntil = Date.now() + 800; adOpen = false; });
  if (typeof sdk.onBackPressed === "function") sdk.onBackPressed(() => {
    if (adOpen || adBusy || Date.now() < adQuietUntil) return true;
    try { return window.appBack ? window.appBack() === true : false; } catch (e) { return false; }
  });
  sdk.initializeAsync()
    .then((info) => {
      if (info && info.err) return; // 원스토어 앱 밖(일반 브라우저)
      sdk.setLoadingProgress(100);
      return sdk.startGameAsync().then(() => setupAds(sdk));
    })
    .catch((e) => console.warn("onestore sdk", e && (e.reason || e.message)));
}
// 전면 광고: 자연스러운 쉬는 구간에서만, 2분 30초에 한 번 이하로 보여 줍니다.
const AD_ID = "x3TAN-TJYU-3KKH-KLV2";
const AD_GAP = 150000;
window.onestoreAd = { atBreak() {} };
let adOpen = false;
let adBusy = false;
let adQuietUntil = 0;
function setupAds(sdk) {
  try { if (!sdk.ads || !sdk.ads.isSupported("interstitial")) return; } catch (e) { return; }
  let last = Date.now();
  let busy = false;
  try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
  window.onestoreAd.atBreak = () => {
    if (busy || Date.now() - last < AD_GAP) return;
    busy = true;
    adBusy = true;
    sdk.ads.showInterstitialAsync({ placementId: AD_ID })
      .catch(() => {})
      .then(() => {
        busy = false;
      adBusy = false;
      adQuietUntil = Date.now() + 800;
        last = Date.now();
        try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
      });
  };
}
if (document.readyState === "complete") setTimeout(startOnestore, 800);
else window.addEventListener("load", () => setTimeout(startOnestore, 800));
  </script>

const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));

  } else if (kind === 'gate') {              // 두 줄 틈: 두 차선을 막고 한 차선만 열어 둔다(다음 문은 옆 차선이 열림)
    const n = 2 + Math.min(1, tr >> 1);
    let open = li;
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < 3; k++) if (k !== open) carOn(LANES[k], z + i * 4300, base, g);
      open = open === 1 ? (R() < 0.5 ? 0 : 2) : 1;

    const n = 3 + Math.min(1, tr >> 2);
    for (let i = 0; i < n; i++) carOn(LANES[(li + i * 2) % 3], z + i * 3200, base * (0.9 + R() * 0.2), g);

  score += pts;
  popup(cleanStreak > 1 ? 'CLEAN x' + cleanStreak : 'CLEAN PASS', '+' + pts, '#7affd0', HW, carBaseY - halfRoadPx * 0.62, false);

const ptr = new Map();

  e.preventDefault(); Snd.init();

});

  const r = ptr.get(e.pointerId);

  let l = keys.l, r = keys.r;

  return (r ? 1 : 0) - (l ? 1 : 0);

  if (state !== 'play' && state !== 'countdown' && state !== 'dying') return;
  setText('score', Math.floor(score).toLocaleString());
  const mult = 1 + Math.min(combo, 9);
  setText('mult', 'x' + mult);
  $('mult').classList.toggle('on', combo > 0);
  $('combo').style.opacity = combo > 0 ? 1 : 0;
  $('combo').firstChild.style.transform = `scaleX(${clamp(comboT / 4, 0, 1)})`;
  hud.spd = hud.spd || $('spd').firstChild;
  const kmh = String(Math.round(speed * M_PER_U * 3.6));
  if (hud.spdV !== kmh) { hud.spdV = kmh; hud.spd.nodeValue = kmh; }
  setText('dist', (meters / 1000).toFixed(2) + ' KM');
  const showFly = airKind === 2 && airT > 0;
  if (hud.flyOn !== showFly) { hud.flyOn = showFly; $('fly').hidden = !showFly; }
  if (showFly) {
    setText('flyT', airT.toFixed(1));
    $('flyBar').firstChild.style.transform = `scaleX(${clamp(airT / FLY_T, 0, 1).toFixed(3)})`;
    $('fly').classList.toggle('low', airT < 1);
  }
  const nb = $('nitroBtn');
  const nq = Math.round(nitro * 100) / 100;
  if (hud.n !== nq) { hud.n = nq; nb.style.setProperty('--n', nq); }
  nb.classList.toggle('on', boosting);
  nb.classList.toggle('ready', nitro > 0.3 && !boosting);
  nb.classList.toggle('empty', nitro <= 0.02);
  const d = state === 'play' ? inputDir() : 0;
  $('stL').classList.toggle('on', d < 0);
  $('stR').classList.toggle('on', d > 0);
}
function showCd(txt, go) {
  const el = $('cd'); el.textContent = txt; el.className = go ? 'go' : '';
  void el.offsetWidth; el.classList.add('pop');
}

// ── 루프 ──
// 일부 안드로이드 웹뷰는 requestAnimationFrame을 부르지 않거나 화면 크기를 늦게(또는 0으로) 알려 준다.
// 그래서 크기는 매 프레임 여러 출처에서 다시 읽고, rAF가 멈추면 타이머로 루프를 이어 간다.
const perf = { u: 0, r: 0, h: 0, wt: 0, wf: 0, gpuAvg: 0, tried: false };
// 1.5초마다 평균 프레임 간격을 보고, 느리면 CPU 캔버스를 한 번 시험한 뒤 해상도를 낮춘다.
function tuneQuality(_, real) {
  perf.wt += real; perf.wf++;
  if (perf.wt < 1.5) return;
  const avg = perf.wt / perf.wf;
  perf.wt = 0; perf.wf = 0;
  if (avg < 0.028) return;
  if (!perf.tried) { perf.tried = true; perf.gpuAvg = avg; setSoft(true); return; }
  if (soft && avg > perf.gpuAvg * 0.9) { setSoft(false); perf.gpuAvg = 0; }
  if (quality < QUALITY.length - 1) { quality++; sizedW = -1; }
}
let last = performance.now(), lastFrameAt = 0, frames = 0, useTimer = false, frameErr = '', gen = 0;
let dbgFreeze = false; // ?debug에서 화면을 멈춰 놓고 볼 때만 쓴다.
function loop() {
  const g = gen;
  if (!useTimer) { requestAnimationFrame(() => frame(g)); return; }
  setTimeout(() => frame(g), 16);
  // rAF가 다시 오기 시작하면 화면 주사율에 맞춰 도는 rAF로 돌아간다.
  requestAnimationFrame(() => { if (useTimer && g === gen) { useTimer = false; gen++; frame(gen); } });
}
function frame(g) {
  if (g !== gen) return; // 루프 방식을 바꾼 뒤 늦게 도착한 이전 예약
  const now = performance.now();
  const real = clamp((now - last) / 1000, 0, 0.05); last = now; lastFrameAt = now;
  try {
    const [vw, vh] = viewSize();
    if (vw !== sizedW || vh !== sizedH) resize();
    if (state !== 'paused' && W && H && vignette) {
      const ts = state === 'dying' ? 0.35 : 1;
      const t0 = performance.now();
      if (!dbgFreeze) update(real * ts, real);
      const t1 = performance.now();
      render();
      const t2 = performance.now();
      updateHud();
      tuneQuality(now - t0, real);
      perf.u = perf.u * 0.9 + (t1 - t0) * 0.1; perf.r = perf.r * 0.9 + (t2 - t1) * 0.1; perf.h = perf.h * 0.9 + (performance.now() - t2) * 0.1;
      frames++;
    }
  } catch (e) {
    frameErr = String(e && e.stack || e).slice(0, 300);
  }
  loop();
}
setInterval(() => {
  if (document.hidden) return;
  if (performance.now() - lastFrameAt > 600 && !useTimer) { useTimer = true; gen++; frame(gen); }
  diag();
}, 500);
let diagFrames = 0, diagStuck = 0;
function diag() {
  const busy = state === 'play' || state === 'countdown' || state === 'title';
  diagStuck = busy && frames === diagFrames ? diagStuck + 1 : 0;
  diagFrames = frames;
  const el = $('diag');
  if (diagStuck >= 3 || frameErr) {
    const [vw, vh] = viewSize();
    el.hidden = false;
    el.textContent = `진단: 화면 ${W}x${H} 읽은값 ${vw}x${vh} inner ${window.innerWidth}x${window.innerHeight} `
      + `dpr ${window.devicePixelRatio} 프레임 ${frames} 타이머 ${useTimer} 상태 ${state}` + (frameErr ? `
${frameErr}` : '');
  } else el.hidden = true;
}

buildSprites();
buildTrack();
resize();
window.addEventListener('resize', resize);
updateHearts();
resetRun(); speed = MAXS * 0.7;
$('bestT').textContent = store.best.toLocaleString();
window.__ns = { get air() { return { t: airT, kind: airKind, vis: airVis }; }, get ahead() { const pz = (position + playerZ) % trackLength; let m = 1e9; for (const c of cars) if (c.on) { const d = wrapHalf(c.z - pz); if (d > -400 && d < m) m = d; } return m; }, get hearts() { return hearts; }, get meters() { return meters; }, get zone() { return zoneIdx; }, get clean() { return cleanStreak; }, get active() { return cars.filter((c) => c.on).length; }, get near() { return nearCount; }, patStats, auto(on) { testAuto = !!on; }, god() { safeT = 1e9; }, get safe() { return safeT; }, get state() { return state; }, get speed() { return speed; }, get score() { return score; }, get frames() { return frames; }, get timer() { return useTimer; }, perf, get W() { return W; }, get DPR() { return DPR; }, get quality() { return quality; }, get soft() { return soft; }, SPR, Snd, start: startGame };
if (/debug/.test(location.search)) {
  window.__ns.give = (type, ahead = 140, x = playerX) => {
    const z = (position + playerZ + ahead) % trackLength;
    const s = segAt(z);
    s.pickups.push({ z, x, type, lap: -1 });
    if (type === 'ramp') for (let k = 0; k < PAD_N; k++) segments[(s.index - PAD_N + k + segments.length) % segments.length].pad = { x, k };
  };
  window.__ns.clearCars = () => { for (const c of cars) if (c.on) { c.on = false; unbucket(c); } };
  window.__ns.freeze = (on) => { dbgFreeze = on; };
  window.__ns.overlap = () => {
    const head = posAbs + playerZ;
    for (const c of cars) if (c.on) { c.abs = head; c.z = ((head % trackLength) + trackLength) % trackLength; c.x = playerX; c.tx = playerX; c.hit = false; c.prev = 400; bucket(c); }
  };
}
loop();
})();
