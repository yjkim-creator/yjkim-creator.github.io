<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1B2440">
  <title>서리 고개</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js"></script>
  <script type="module">
// 원스토어 앱 안에서 실행될 때 SDK와 연결합니다. 일반 브라우저에서는 아무 일도 하지 않습니다.
import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";

const sdk = createSDK();
sdk.on("pause", () => {});
sdk.on("resume", () => {});
sdk.initializeAsync()
  .then((info) => {
    if (info && info.err) return; // 원스토어 앱 밖(일반 브라우저)
    sdk.setLoadingProgress(100);
    return sdk.startGameAsync();
  })
  .catch((e) => console.warn("onestore sdk", e && (e.reason || e.message)));
  </script>
</head>
<body>
  <main id="app"></main>
  <script src="src/logic.js"></script>
  <script src="src/art.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
