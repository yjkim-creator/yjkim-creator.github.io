<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>종이배 포구</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js"></script>
  <script type="module">
// 원스토어 앱 안에서 실행될 때 SDK와 연결합니다. 일반 브라우저에서는 아무 일도 하지 않습니다.
import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";

// 검사 화면이 듣기 시작한 뒤에 인사(hello)를 보내도록 페이지 로드 후 잠깐 기다립니다.
function startOnestore() {
  const sdk = createSDK();
  sdk.on("pause", () => {});
  sdk.on("resume", () => {});
  sdk.initializeAsync()
    .then((info) => {
      if (info && info.err) return; // 원스토어 앱 밖(일반 브라우저)
      sdk.setLoadingProgress(100);
      return sdk.startGameAsync().then(() => setupAds(sdk));
    })
    .catch((e) => console.warn("onestore sdk", e && (e.reason || e.message)));
}
// 모듈 스크립트는 문서 해석 뒤에 실행되므로 load 를 기다리지 않고 바로 연결합니다(검사 팝업에서 load 가 늦을 수 있음).
// 전면 광고: 자연스러운 쉬는 구간에서만, 2분 30초에 한 번 이하로 보여 줍니다.
const AD_ID = "xHTYF-JVK8-5VTA-KFJN";
const AD_GAP = 150000;
window.onestoreAd = { atBreak() {} };
function setupAds(sdk) {
  try { if (!sdk.ads || !sdk.ads.isSupported("interstitial")) return; } catch (e) { return; }
  let last = Date.now();
  let busy = false;
  try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
  window.onestoreAd.atBreak = () => {
    if (busy || Date.now() - last < AD_GAP) return;
    busy = true;
    sdk.ads.showInterstitialAsync({ placementId: AD_ID })
      .catch(() => {})
      .then(() => {
        busy = false;
        last = Date.now();
        try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
      });
  };
}
startOnestore();
  </script>
</head>
<body>
  <main id="app"></main>
  <script src="lib/sfx.js"></script>
  <script src="src/logic.js"></script>
  <script src="src/app.js"></script>
<script src="src/leaderboard.js"></script>
<script>window.Rank && Rank.setup(Object.assign({"game": "paperharbor", "title": "종이배 포구 · 모은 별", "unit": "★", "max": 100000, "theme": {"bg": "rgba(18,63,78,.6)", "panel": "#FBF4E4", "text": "#2E2A24", "mute": "#7a6f5f", "accent": "#1F6F8B", "accentText": "#FBF4E4", "line": "rgba(46,42,36,.12)", "font": "\"Pretendard\",\"Noto Sans KR\",system-ui,sans-serif"}}, { read: function () { return window.Logic.totalStars(window.Logic.sanitize(JSON.parse(localStorage.getItem('paperharbor-v1')))); } }));</script>
</body>
</html>
