<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>공책 골프</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js"></script>
  <script type="module">
// 원스토어 앱 안에서 실행될 때 SDK와 연결합니다. 일반 브라우저에서는 아무 일도 하지 않습니다.
import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";

// 검사 화면이 듣기 시작한 뒤에 인사(hello)를 보내도록 페이지 로드 후 잠깐 기다립니다.
function startOnestore() {
  const sdk = createSDK();
  sdk.on("pause", () => {});
  sdk.on("resume", () => {});
  sdk.initializeAsync()
    .then((info) => {
      if (info && info.err) return; // 원스토어 앱 밖(일반 브라우저)
      sdk.setLoadingProgress(100);
      return sdk.startGameAsync().then(() => setupAds(sdk));
    })
    .catch((e) => console.warn("onestore sdk", e && (e.reason || e.message)));
}
// 전면 광고: 자연스러운 쉬는 구간에서만, 2분 30초에 한 번 이하로 보여 줍니다.
const AD_ID = "xFDJR-8B5Y-3WNQ-XVQZ";
const AD_GAP = 150000;
window.onestoreAd = { atBreak() {} };
function setupAds(sdk) {
  try { if (!sdk.ads || !sdk.ads.isSupported("interstitial")) return; } catch (e) { return; }
  let last = Date.now();
  let busy = false;
  try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
  window.onestoreAd.atBreak = () => {
    if (busy || Date.now() - last < AD_GAP) return;
    busy = true;
    sdk.ads.showInterstitialAsync({ placementId: AD_ID })
      .catch(() => {})
      .then(() => {
        busy = false;
        last = Date.now();
        try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
      });
  };
}
if (document.readyState === "complete") setTimeout(startOnestore, 800);
else window.addEventListener("load", () => setTimeout(startOnestore, 800));
  </script>
</head>
<body>
  <main id="app"></main>
  <script src="src/logic.js"></script>
  <script src="src/app.js"></script>
<script src="src/leaderboard.js"></script>
<script>window.Rank && Rank.setup(Object.assign({"game": "notebookputt", "title": "공책 골프 · 계단 코스 최고 층", "unit": "층", "max": 99999, "theme": {"bg": "rgba(31,47,77,.55)", "panel": "#fffdf6", "text": "#1f2f4d", "mute": "#5a6b89", "accent": "#2f5da8", "accentText": "#ffffff", "line": "rgba(31,47,77,.12)", "font": "\"Noto Sans KR\",\"Apple SD Gothic Neo\",system-ui,sans-serif"}}, { read: function () { return (function(s){var b=+((s.ladder||{}).best)||0;return b>1?b:0;})(JSON.parse(localStorage.getItem('notebook-putt-v1')||'{}')); } }));</script>
</body>
</html>
