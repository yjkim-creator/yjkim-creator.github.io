<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#ffcfc0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>층층 베이커리</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js"></script>
  <script type="module">
// 원스토어 앱 안에서 실행될 때 SDK와 연결합니다. 일반 브라우저에서는 아무 일도 하지 않습니다.
import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";

// 검사 화면이 듣기 시작한 뒤에 인사(hello)를 보내도록 페이지 로드 후 잠깐 기다립니다.
function startOnestore() {
  const sdk = createSDK();
  sdk.on("pause", () => {});
  sdk.on("resume", () => {});
  sdk.initializeAsync()
    .then((info) => {
      if (info && info.err) return; // 원스토어 앱 밖(일반 브라우저)
      sdk.setLoadingProgress(100);
      return sdk.startGameAsync().then(() => setupAds(sdk));
    })
    .catch((e) => console.warn("onestore sdk", e && (e.reason || e.message)));
}
// 전면 광고: 자연스러운 쉬는 구간에서만, 2분 30초에 한 번 이하로 보여 줍니다.
const AD_ID = "xWV78-EBP9-FCVD-Y8QK";
const AD_GAP = 150000;
window.onestoreAd = { atBreak() {} };
function setupAds(sdk) {
  try { if (!sdk.ads || !sdk.ads.isSupported("interstitial")) return; } catch (e) { return; }
  let last = Date.now();
  let busy = false;
  try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
  window.onestoreAd.atBreak = () => {
    if (busy || Date.now() - last < AD_GAP) return;
    busy = true;
    sdk.ads.showInterstitialAsync({ placementId: AD_ID })
      .catch(() => {})
      .then(() => {
        busy = false;
        last = Date.now();
        try { sdk.ads.loadInterstitial({ placementId: AD_ID }); } catch (e) {}
      });
  };
}
if (document.readyState === "complete") setTimeout(startOnestore, 800);
else window.addEventListener("load", () => setTimeout(startOnestore, 800));
  </script>
</head>
<body>
  <main id="app"></main>
  <script src="src/haptics.js" data-game="tiertop" data-sound="#muteBtn" data-style="svg"></script>
  <script src="lib/three.min.js"></script>
  <script src="lib/kit3d.js"></script>
  <script src="lib/sfx.js"></script>
  <script src="src/logic.js?v=7"></script>
  <script src="src/scene.js?v=7"></script>
  <script src="src/app.js?v=7"></script>
<script src="src/leaderboard.js"></script>
<script>window.Rank && Rank.setup(Object.assign({"game": "tiertop", "title": "층층 베이커리 · 최고 높이", "unit": "층", "max": 100000, "theme": {"bg": "rgba(79,49,39,.5)", "panel": "#fffdf8", "text": "#4f3127", "mute": "#8a6152", "accent": "#e2627f", "accentText": "#ffffff", "line": "rgba(79,49,39,.12)", "font": "'Trebuchet MS','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif"}, "tab": {"ko": "최고 높이", "en": "Tallest cake", "ja": "最高の高さ"}}, { read: function () { return +(JSON.parse(localStorage.getItem('tiertop-save-v1')||'{}').best)||0; }, boards: [Object.assign({"id": "stage", "game": "tiertop-stage", "max": 9999999, "unit": "", "tab": {"ko": "최고 단계", "en": "Best stage", "ja": "最高ステージ"}, "title": {"ko": "층층 베이커리 · 최고 도달 단계", "en": "Tiertop Bakery · Best stage", "ja": "つみつみケーキ屋さん · 最高ステージ"}}, { read: function () { return (function(s){var st=s.stage||{};var b=+st.best||0;var n=0;(st.stars||[]).forEach(function(x){n+=Math.max(0,Math.min(3,+x||0));});return b>0?b*1000+Math.min(999,n):0;})(JSON.parse(localStorage.getItem('tiertop-save-v1')||'{}')); }, format: function (n) { return (function(s){return Rank.lang==='en'?'Stage '+s:Rank.lang==='ja'?s+'ステージ':s+'단계';})(Math.floor(n/1000)); } })] }));</script>
</body>
</html>
